spring.application.name=tradesim

spring.data.mongodb.database=tradesim
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
server.port=5001

tradesim.client-origin=${CLIENT_ORIGIN:http://localhost:5173}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/documentation

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,startup
