spring.application.name=tradesim

spring.data.mongodb.database=tradesim
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}

# The host assigns the port in production. 5001 is the local default.
server.port=${PORT:5001}

# Railway terminates TLS and forwards, so the request Spring sees arrives over plain HTTP from the
# platform edge. Without this the scheme is wrong on redirects and, more importantly, every caller
# looks like the proxy to the rate limiter and they all share one allowance.
server.forward-headers-strategy=framework

tradesim.client-origin=${CLIENT_ORIGIN:http://localhost:5173}

# The cookie has to be Secure in production and must not be over plain HTTP locally, so both are
# configuration rather than a constant.
tradesim.cookie.secure=${COOKIE_SECURE:false}
tradesim.cookie.same-site=${COOKIE_SAME_SITE:Lax}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/documentation

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,startup,instanceLease
